
services:
  aibirdlab_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibirdlab_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      aibirdlab_db:
        condition: service_healthy
    restart: always

  aibirdlab_db:
    image: postgres:17-alpine
    container_name: aibirdlab_db
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  huggingface_cache: